name: Release image

# Builds a multi-arch (amd64 + arm64) production image and pushes it to the
# GitHub Container Registry (GHCR) whenever a version tag is pushed.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# The published image is ghcr.io/<owner>/<repo> — see docker-compose.yml.
# arm64 is built under QEMU emulation (native better-sqlite3 compilation), so
# a release build takes noticeably longer than the CI build.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)build, e.g. v1.3.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify package.json version matches the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "git tag: $tag / package.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::git tag ($tag) does not match package.json version ($pkg) — bump package.json before tagging"
            exit 1
          fi

      # The ubuntu-latest runner has only ~14 GB free on /. A two-platform
      # build (amd64 + arm64) with the full node_modules (Prisma 7 bundles
      # several multi-MB WASM query engines) otherwise fills the BuildKit
      # content store — "no space left on device". Drop preinstalled SDKs we
      # don't use to free ~20 GB.
      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: export only final-stage layers. mode=max additionally
          # caches every intermediate stage — too large for the runner disk
          # alongside a two-platform build.
          cache-to: type=gha,mode=min
          # Clean multi-arch manifest list without the extra attestation
          # manifest — older Docker/registry UIs (e.g. Synology Container
          # Manager) otherwise show a confusing "unknown/unknown" entry.
          provenance: false
