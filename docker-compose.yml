services:
  bandplaner:
    build: .
    image: bandplaner:latest
    restart: unless-stopped
    ports:
      # Links der Port, auf dem die App auf der DiskStation erreichbar ist.
      # Bei Bedarf anpassen (z. B. "8080:3000"), falls Port 3000 schon belegt ist.
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/production.db"
      AUTH_SECRET: "${AUTH_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      # NextAuth (Auth.js) v5 prueft im Produktionsmodus (NODE_ENV=production),
      # ob es dem Host des eingehenden Requests vertrauen darf, und verweigert
      # sonst mit "There was a problem with the server configuration". Da der
      # Host je nach Netzwerk/Deployment variieren kann (Hostname, IP, Domain),
      # vertrauen wir hier explizit statt eine einzelne feste URL zu erzwingen.
      AUTH_TRUST_HOST: "true"
      # E-Mail-Benachrichtigungen (optional): Ohne SMTP_HOST/SMTP_FROM laeuft die
      # App normal weiter, es werden dann nur keine Mails verschickt. SMTP_PORT
      # ist standardmaessig 587, SMTP_SECURE wird aus dem Port abgeleitet
      # (465 = implizites TLS) und kann bei Bedarf ueberschrieben werden.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
    volumes:
      # Datenbank, hochgeladene Song-/Band-Dateien sowie Profil-/Bandbilder
      # liegen in benannten Volumes und überleben damit Image-Updates/Neustarts.
      - bandplaner_data:/data
      - bandplaner_storage:/app/storage
      - bandplaner_uploads:/app/public/uploads

volumes:
  bandplaner_data:
  bandplaner_storage:
  bandplaner_uploads:
