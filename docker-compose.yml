services:
  bandplaner:
    # Vorgefertigtes Multi-Arch-Image (amd64/arm64) aus der GitHub Container
    # Registry - kein lokaler Build noetig. Aktualisieren:
    #   docker compose pull && docker compose up -d
    # Statt "latest" eine feste Version pinnen? Dann z. B. ":1.3.0" eintragen
    # (verfuegbare Tags: https://github.com/maxxs78/bandplaner/pkgs/container/bandplaner).
    # Image lieber selbst bauen (Entwicklung/Fork)? Siehe docker-compose.build.yml.
    image: ghcr.io/maxxs78/bandplaner:latest
    restart: unless-stopped
    # Prueft, ob der Next.js-Server antwortet. Nutzt node (im Image vorhanden),
    # damit weder curl noch wget nachinstalliert werden muessen. start_period
    # deckt Migrationslauf + Serverstart ab (auf schwacher ARM-Hardware langsam).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    ports:
      # Links der Port, auf dem die App auf der DiskStation erreichbar ist.
      # Bei Bedarf anpassen (z. B. "8080:3000"), falls Port 3000 schon belegt ist.
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/production.db"
      AUTH_SECRET: "${AUTH_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      # NextAuth (Auth.js) v5 prueft im Produktionsmodus (NODE_ENV=production),
      # ob es dem Host des eingehenden Requests vertrauen darf, und verweigert
      # sonst mit "There was a problem with the server configuration". Da der
      # Host je nach Netzwerk/Deployment variieren kann (Hostname, IP, Domain),
      # vertrauen wir hier explizit statt eine einzelne feste URL zu erzwingen.
      AUTH_TRUST_HOST: "true"
      # Offene Selbstregistrierung unter /register. Standard "false": nur das
      # erste Konto und per Einladungslink eingeladene Personen koennen sich
      # registrieren, alle anderen kommen nur ueber einen Einladungslink dazu.
      # "true" oeffnet die Registrierung fuer beliebige Besucher.
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
      # E-Mail-Benachrichtigungen (optional): Ohne SMTP_HOST/SMTP_FROM laeuft die
      # App normal weiter, es werden dann nur keine Mails verschickt. SMTP_PORT
      # ist standardmaessig 587, SMTP_SECURE wird aus dem Port abgeleitet
      # (465 = implizites TLS) und kann bei Bedarf ueberschrieben werden.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      # Anlageassistent beim Song-Neuanlegen (optional): Ohne diese Variablen
      # bleibt nur die ID3-Vorschau aus hochgeladenen Dateien aktiv, die
      # Online-Recherche wird dann uebersprungen statt zu fehlschlagen.
      MUSICBRAINZ_USER_AGENT: "${MUSICBRAINZ_USER_AGENT:-}"
      DISCOGS_TOKEN: "${DISCOGS_TOKEN:-}"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      # Adresssuche fuer Orte (optional): leer = oeffentliche Nominatim-Instanz.
      NOMINATIM_BASE_URL: "${NOMINATIM_BASE_URL:-}"
    volumes:
      # Datenbank, hochgeladene Song-/Band-Dateien sowie Profil-/Bandbilder
      # liegen in benannten Volumes und überleben damit Image-Updates/Neustarts.
      - bandplaner_data:/data
      - bandplaner_storage:/app/storage
      - bandplaner_uploads:/app/public/uploads

volumes:
  bandplaner_data:
  bandplaner_storage:
  bandplaner_uploads:
